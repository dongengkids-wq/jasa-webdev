<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan — RND Solution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#0B0F19', surface: '#131826', text: '#F5F5F7', muted: '#9CA3AF', accent: '#6EE7B7' },
          fontFamily: { display: ['Sora', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bg text-text font-display min-h-screen flex items-center justify-center px-6">

  <div class="text-center max-w-md">
    <p class="text-accent font-mono text-sm mb-4">// error 404</p>
    <h1 class="text-6xl md:text-8xl font-extrabold mb-6 text-accent">404</h1>
    <h2 class="text-xl md:text-2xl font-bold mb-4">Halaman Tidak Ditemukan</h2>
    <p class="text-muted mb-10">
      Sepertinya halaman yang kamu cari sudah dipindahkan atau tidak pernah ada. Yuk kembali ke halaman utama.
    </p>
    <a href="/" class="inline-block bg-accent text-bg font-semibold px-7 py-3.5 rounded-full hover:opacity-90 transition-opacity">
      Kembali ke Beranda →
    </a>
  </div>

  <script src="/floating-wa.js"></script>
</body>
</html>
