<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — RND Solution</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    var ArtikelPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var kategori = entry.getIn(['data', 'kategori']) || '';
        var body = entry.getIn(['data', 'body']) || '';
        var thumbnailField = entry.getIn(['data', 'thumbnail']);
        var thumbnail = thumbnailField ? this.props.getAsset(thumbnailField) : null;

        return h('div', { style: { padding: '32px', fontFamily: 'sans-serif', maxWidth: '700px', margin: '0 auto', lineHeight: '1.6', color: '#1a1a1a' } },
          kategori && h('div', { style: { color: '#059669', fontSize: '12px', fontWeight: 'bold', marginBottom: '8px', textTransform: 'uppercase' } }, kategori),
          h('h1', { style: { fontSize: '32px', fontWeight: '800', marginBottom: '16px' } }, title),
          thumbnail && h('img', { src: thumbnail.toString(), style: { width: '100%', borderRadius: '12px', marginBottom: '24px' } }),
          h('div', { dangerouslySetInnerHTML: { __html: marked.parse(body) } })
        );
      }
    });

    CMS.registerPreviewTemplate('artikel', ArtikelPreview);
  </script>
</body>
</html>
